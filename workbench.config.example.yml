# Example workbench config in YAML - comments and multi-line values are allowed.
# Run it with:  npm run dev -- --config workbench.config.example.yml plugins
#
# The parser is picked by extension: .yml / .yaml are parsed as YAML, .json as
# JSON. Both formats share the schema, the validation and the ${env:VAR}
# expansion. Without --config the core looks for workbench.config.yml, then
# workbench.config.yaml, then workbench.config.json in the working directory.
#
# This file is plugin-less like the default config: the core ships NO plugins,
# so every source below is an EXAMPLE, commented out. Uncomment ONE and name the
# plugins you want in the `plugins:` roster.
sources: []
  # 1. LOCAL source: a sibling checkout of the plugins repository, no network.
  # - kind: path
  #   id: workbench-plugins
  #   path: ../workbench-plugins/plugins

  # 2. PUBLIC git source: the production shape. The repository is cloned once
  #    into WORKBENCH_CACHE_DIR (/var/lib/workbench/sources in the service image)
  #    and `subdir` selects the plugin directory inside the checkout.
  # - kind: git
  #   id: workbench-plugins
  #   url: https://github.com/nexuslbs/workbench-plugins
  #   ref: main
  #   subdir: plugins

  # 3. PRIVATE git source WITH CREDENTIALS: `auth.credential` is a credential
  #    REFERENCE BY NAME, never a value. It is resolved through the credentials
  #    service by a PROVIDER PLUGIN - the core ships none, so name a
  #    `credentials-basic:` row (or another provider plugin) from a source that
  #    needs no credential; a credential-dependent source with no provider loaded
  #    is DEFERRED. See docs/CREDENTIALS.md section 6 ("Private plugin sources").
  # - kind: git
  #   id: workbench-plugins-private
  #   url: https://github.com/nexuslbs/workbench-plugins-private
  #   ref: main                      # branch, tag or sha
  #   subdir: plugins                # optional
  #   auth:
  #     type: github-app             # or `token` (default)
  #     credential: GITHUB_APP_KEY   # a NAME; the value never appears in a file
  #     appId: 3967918               # github-app: the App id (not a secret)
  #     installationId: 138119822    # github-app: the installation (not a secret)
  #     # apiBase: https://api.github.com   # GitHub Enterprise
  #     # username: x-access-token         # token: basic-auth user

# `plugins:` is the ROSTER: only the plugins named here are LOADED. A plugin
# discovered in `sources:` without a row is merely AVAILABLE - listed by
# `workbench plugins` / the Plugin Inventory page and loadable with one `enable`
# (which persists the row). A row with `disabled: true` PARKS a plugin
# (configured, deliberately off).
# YAML scalars must stay strings here: quote values like "yes", "on", "42",
# "1.0" and anything starting with a YAML indicator character (* & ! % @ ` etc).
# EXAMPLE:
# plugins:
#   hello-world:
#     message: Hello World
plugins: {}

# Web UI (composed by UI plugins through the ctx.web seam; the core only serves
# bytes and routes). `workbench web` starts the listener; `workbench serve`
# starts the same listener in the service process when `enabled` is true.
# Absent or `enabled: false` keeps the historical behaviour exactly.
# (UI plugins come from an external source like every other plugin.)
# web:
#   enabled: true
#   host: 127.0.0.1
#   port: 12348
